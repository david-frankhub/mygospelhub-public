<style>
  :root{
    --bg:#0B0B0D;
    --bg-raised:#141416;
    --bg-card:#18181B;
    --text:#F2EFE9;
    --text-dim:#8A8780;
    --gold:#D9A441;
    --wine:#7A1F2B;
    --wine-bright:#9C2C3A;
    --line: rgba(242,239,233,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:#0B0B0D;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  button{font-family:inherit; cursor:pointer;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 5%; position:sticky; top:0;
    background:rgba(11,11,13,0.85); backdrop-filter:blur(10px);
    z-index:100; border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Fraunces',serif; font-size:22px; font-weight:700; display:flex; align-items:baseline; gap:2px;}
  .logo .dot{color:var(--gold);}
  .btn{padding:10px 20px; border-radius:100px; font-size:13px; font-weight:600; border:1px solid var(--line); background:transparent; color:var(--text); transition:all 0.2s;}
  .btn-gold{background:var(--gold); color:#0B0B0D; border:1px solid var(--gold);}
  .btn-gold:hover{background:#E5B45C;}

  .browse-header{padding:44px 5% 0; max-width:1100px; margin:0 auto;}
  .browse-header h1{font-size:clamp(28px,4vw,40px); margin-bottom:24px;}

  .search-bar{position:relative; margin-bottom:24px;}
  .search-bar svg{position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--text-dim); pointer-events:none;}
  .search-bar input{
    width:100%; background:var(--bg-card); border:1px solid var(--line); border-radius:100px;
    padding:15px 20px 15px 46px; font-size:14.5px; color:var(--text); outline:none;
    font-family:'Inter',sans-serif; transition:border-color 0.2s;
  }
  .search-bar input:focus{border-color:var(--gold);}
  .search-bar input::placeholder{color:var(--text-dim);}

  .filter-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .filter-label{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-right:2px;}
  .chip{
    padding:9px 18px; border-radius:100px; border:1px solid var(--line);
    font-size:12.5px; font-weight:500; color:var(--text-dim); transition:all 0.2s; cursor:pointer; background:transparent;
  }
  .chip:hover, .chip.active{border-color:var(--gold); color:var(--gold); background:rgba(217,164,65,0.08);}

  .sort-select{
    background:var(--bg-card); border:1px solid var(--line); color:var(--text-dim);
    font-size:12.5px; padding:10px 14px; border-radius:100px; font-family:'Inter',sans-serif;
    outline:none; cursor:pointer; margin-bottom:20px;
  }

  .results-count{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim);
    padding-bottom:16px; border-bottom:1px solid var(--line); margin-bottom:24px;
    max-width:1100px; margin-left:auto; margin-right:auto; padding-left:5%; padding-right:5%;
  }
  .results-count strong{color:var(--text); font-weight:600;}

  .gist-grid{
    max-width:1100px; margin:0 auto; padding:0 5% 20px;
    display:grid; grid-template-columns:repeat(3,1fr); gap:22px;
  }
  .gist-card{
    background:var(--bg-card); border-radius:14px; border:1px solid var(--line); overflow:hidden;
    cursor:pointer; transition:transform 0.2s, border-color 0.2s;
  }
  .gist-card:hover{transform:translateY(-3px); border-color:rgba(217,164,65,0.3);}
  .gist-cover{aspect-ratio:16/10; background:linear-gradient(135deg,#262629,#17171a); position:relative;}
  .gist-cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .gist-cover .cat{
    position:absolute; top:12px; left:12px;
    font-family:'JetBrains Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.05em;
    background:var(--wine); color:#F2DCC9; padding:4px 9px; border-radius:100px;
  }
  .gist-body{padding:16px;}
  .gist-body h3{font-size:14.5px; font-weight:600; line-height:1.35; margin-bottom:8px;}
  .gist-body h3 mark{background:rgba(217,164,65,0.28); color:var(--gold); border-radius:2px;}
  .gist-meta{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}

  .state-block{
    max-width:1100px; margin:0 auto; padding:0 5%;
  }
  .state-block-inner{
    text-align:center; padding:48px 20px; color:var(--text-dim); font-size:13.5px;
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
  }

  .load-more-wrap{max-width:1100px; margin:0 auto; padding:24px 5% 40px; text-align:center;}
  .load-more-btn{
    padding:13px 30px; border-radius:100px; border:1px solid var(--line);
    background:var(--bg-card); color:var(--text); font-size:13.5px; font-weight:600; transition:all 0.2s;
  }
  .load-more-btn:hover{border-color:var(--gold); color:var(--gold);}

  @media (max-width:900px){
    .gist-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:600px){
    .gist-grid{grid-template-columns:1fr;}
  }

  /* ===== New card style (matches homepage / music page) ===== */
  .tc-list{max-width:1100px; margin:0 auto; padding:0 5% 20px; display:flex !important; flex-direction:column; gap:12px;}
  .track-card{display:grid; grid-template-columns:86px 1fr auto; align-items:center; gap:16px; padding:14px; border:1px solid var(--line); border-radius:16px; background:var(--bg-raised); transition:border-color .2s; cursor:pointer;}
  .track-card:hover{border-color:rgba(217,164,65,0.35);}
  .tc-art{width:86px; height:86px; border-radius:12px; background:linear-gradient(135deg, #9C2C3A, #2A0810); background-size:cover; background-position:center;}
  .tc-body{min-width:0;}
  .tc-title{font-size:16px; font-weight:600; margin-bottom:4px; line-height:1.25; overflow-wrap:anywhere;}
  .tc-title mark,.gr-title mark{background:rgba(217,164,65,0.3); color:inherit; border-radius:3px;}
  .tc-artist{font-size:13.5px; font-weight:700; color:var(--gold); margin-bottom:4px; overflow-wrap:anywhere;}
  .tc-meta{font-size:12.5px; color:var(--text-dim);}
  .tc-desc{font-size:12px; color:rgba(138,135,128,.7); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tc-lock{font-size:12px; color:var(--gold); margin-top:4px; font-family:'JetBrains Mono',monospace;}
  .tc-actions{display:flex; gap:10px;}
  .tc-btn{width:50px; height:50px; border-radius:12px; border:1px solid var(--line); background:var(--bg-card); color:var(--text); display:flex; align-items:center; justify-content:center; transition:all .2s; padding:0; cursor:pointer;}
  .tc-btn svg{width:20px; height:20px;}
  .tc-btn:hover{border-color:var(--gold); color:var(--gold);}
  .tc-btn.dl{border-color:rgba(217,164,65,0.45); color:var(--gold); background:rgba(217,164,65,0.07);}
  .tc-btn.dl:hover{background:rgba(217,164,65,0.16);}
  .tc-btn[disabled]{opacity:.35; cursor:not-allowed;}
  .load-more-wrap{padding:8px 5% 56px !important;}
  .load-more-btn{width:min(100%,470px); padding:18px 24px !important; border-radius:16px !important; border:1px solid rgba(217,164,65,0.45) !important; background:rgba(217,164,65,0.07) !important; color:var(--gold) !important; font-family:'Fraunces',serif; font-size:19px !important; font-weight:600;}
  .load-more-btn:hover{background:rgba(217,164,65,0.16) !important;}
  .gist-row{display:grid; grid-template-columns:96px 1fr auto; align-items:center; gap:16px; padding:12px; border:1px solid var(--line); border-radius:16px; background:var(--bg-raised); cursor:pointer; transition:border-color .2s;}
  .gist-row:hover{border-color:rgba(217,164,65,0.35);}
  .gr-art{width:96px; height:80px; border-radius:12px; background:linear-gradient(135deg, #9C2C3A, #2A0810); background-size:cover; background-position:center;}
  .gr-body{min-width:0;}
  .gr-cat{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); border:1px solid rgba(217,164,65,0.4); border-radius:100px; padding:3px 9px; margin-bottom:7px;}
  .gr-title{font-size:15.5px; font-weight:600; line-height:1.3; margin-bottom:5px; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .gr-meta{font-size:11.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .gr-go{width:40px; height:40px; border-radius:12px; border:1px solid rgba(217,164,65,0.45); background:rgba(217,164,65,0.07); color:var(--gold); display:flex; align-items:center; justify-content:center;}
  .gr-go svg{width:18px; height:18px;}
  @media (max-width:560px){
    .track-card{grid-template-columns:72px 1fr; row-gap:12px; padding:12px;}
    .tc-art{width:72px; height:72px;}
    .tc-actions{grid-column:1/-1; justify-content:flex-end;}
    .tc-btn{width:54px; height:44px;}
    .gist-row{grid-template-columns:84px 1fr; padding:10px;}
    .gr-art{width:84px; height:72px;}
    .gr-go{display:none;}
  }
</style>

<body>

  <nav>
    <div class="logo">MyGospelHub<span class="dot">.</span></div>
    <a href="index.html" class="btn btn-gold">Home</a>
  </nav>

  <div class="browse-header">
    <h1>All Gist</h1>
    <div class="search-bar">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search gist articles...">
    </div>
    <div class="filter-row">
      <span class="filter-label">Category</span>
      <div id="categoryChips" style="display:contents;">
        <button class="chip active" data-category="All">All</button>
      </div>
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="newest">Newest</option>
      <option value="reads">Most read</option>
      <option value="az">A–Z</option>
    </select>
  </div>

  <div class="results-count" id="resultsCount">Loading…</div>
  <div class="gist-grid tc-list" id="gistGrid"></div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <button class="load-more-btn" id="loadMoreBtn">See More</button>
  </div>

<script>
  const SUPABASE_URL = "https://kqgnpryubgdtmtcjtasi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxZ25wcnl1YmdkdG10Y2p0YXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTQ1NjQsImV4cCI6MjA5OTczMDU2NH0.T0y1CVCzIvfmK4vgczmlpiAFZP63MRLZT5eymu8R6jY";

  async function supabaseQuery(table, params) {
    const url = `${SUPABASE_URL}/rest/v1/${table}?${params}`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Failed to load ${table}`);
    return res.json();
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function formatCount(n) {
    n = n || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  function timeAgo(dateString) {
    if (!dateString) return "";
    const diff = Date.now() - new Date(dateString).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    const days = Math.floor(hrs / 24);
    return days + "d ago";
  }

  function highlight(text, q) {
    const safe = escapeHtml(text);
    if (!q) return safe;
    const idx = safe.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return safe;
    return safe.slice(0, idx) + "<mark>" + safe.slice(idx, idx + q.length) + "</mark>" + safe.slice(idx + q.length);
  }

  const PAGE_SIZE = 10;
  let allPosts = [];
  let query = "";
  let activeCategory = "All";
  let sort = "newest";
  let visibleCount = PAGE_SIZE;

  function getFiltered() {
    let list = allPosts.filter(p => {
      const matchesCategory = activeCategory === "All" || (p.category || "") === activeCategory;
      const q = query.trim().toLowerCase();
      const matchesQuery = !q || p.title.toLowerCase().includes(q) || (p.body || "").toLowerCase().includes(q);
      return matchesCategory && matchesQuery;
    });
    if (sort === "newest") list.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    else if (sort === "reads") list.sort((a, b) => (b.reads || 0) - (a.reads || 0));
    else if (sort === "az") list.sort((a, b) => a.title.localeCompare(b.title));
    return list;
  }

  function postDest(p) {
    return `gist-post.html?${p.slug ? "slug=" + p.slug : "id=" + p.id}`;
  }

  function render() {
    const filtered = getFiltered();
    const visible = filtered.slice(0, visibleCount);
    const countEl = document.getElementById("resultsCount");
    const grid = document.getElementById("gistGrid");
    const loadMoreWrap = document.getElementById("loadMoreWrap");

    countEl.innerHTML = `<strong>${filtered.length}</strong> article${filtered.length !== 1 ? "s" : ""}`;

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="state-block-inner" style="grid-column:1/-1;">No articles found. Try a different search or filter.</div>`;
      loadMoreWrap.style.display = "none";
      return;
    }

    grid.innerHTML = visible.map(p => `
      <div class="gist-row" data-id="${p.id}">
        <div class="gr-art" style="${p.cover_url ? `background-image:url('${escapeHtml(p.cover_url)}')` : ""}"></div>
        <div class="gr-body">
          <span class="gr-cat">${escapeHtml(p.category || "Gist")}</span>
          <div class="gr-title">${highlight(p.title, query)}</div>
          <div class="gr-meta">${timeAgo(p.created_at)} · ${formatCount(p.reads)} reads</div>
        </div>
        <div class="gr-go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
      </div>
    `).join("");

    grid.querySelectorAll(".gist-row").forEach(card => {
      card.addEventListener("click", () => {
        const post = allPosts.find(p => String(p.id) === card.dataset.id);
        if (post) window.location.href = postDest(post);
      });
    });

    document.getElementById("loadMoreBtn").textContent = `See More (${Math.max(filtered.length - visibleCount, 0)} remaining)`;

    loadMoreWrap.style.display = visibleCount < filtered.length ? "block" : "none";
  }

  function renderCategoryChips() {
    const categories = Array.from(new Set(allPosts.map(p => (p.category || "").trim()).filter(Boolean)));
    const wrap = document.getElementById("categoryChips");
    wrap.innerHTML = `<button class="chip active" data-category="All">All</button>` +
      categories.map(c => `<button class="chip" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("");

    wrap.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        wrap.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        activeCategory = chip.dataset.category;
        visibleCount = PAGE_SIZE;
        render();
      });
    });
  }

  document.getElementById("searchInput").addEventListener("input", (e) => {
    query = e.target.value;
    visibleCount = PAGE_SIZE;
    render();
  });

  document.getElementById("sortSelect").addEventListener("change", (e) => {
    sort = e.target.value;
    render();
  });

  document.getElementById("loadMoreBtn").addEventListener("click", () => {
    visibleCount += PAGE_SIZE;
    render();
  });

  async function loadPosts() {
    try {
      const rows = await supabaseQuery("gist_articles", "status=eq.Published&select=*");
      allPosts = rows || [];
      renderCategoryChips();
      render();
    } catch (err) {
      console.error(err);
      document.getElementById("resultsCount").textContent = "";
      document.getElementById("gistGrid").innerHTML = `<div class="state-block-inner" style="grid-column:1/-1;">Couldn't load gist right now. Refresh to try again.</div>`;
    }
  }

  loadPosts();
</script>
