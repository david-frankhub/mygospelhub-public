<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="https://kqgnpryubgdtmtcjtasi.supabase.co/storage/v1/object/public/covers/file_00000000a20081f48e8855cb4ade1850.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — MyGospelHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D; --bg-raised:#141416; --bg-card:#18181B;
    --text:#F2EFE9; --text-dim:#8A8780; --gold:#D9A441;
    --wine:#7A1F2B; --wine-bright:#9C2C3A; --green:#3FAE6A; --line: rgba(242,239,233,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--gold); color:#0B0B0D;}
  button{font-family:inherit; cursor:pointer;}

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 5%; position:sticky; top:0;
    background:rgba(11,11,13,0.85); backdrop-filter:blur(10px);
    z-index:100; border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Fraunces',serif; font-size:22px; font-weight:700; display:flex; align-items:baseline; gap:2px;}
  .logo .dot{color:var(--gold);}
  .btn{padding:10px 20px; border-radius:100px; font-size:13px; font-weight:600; border:1px solid var(--line); background:transparent; color:var(--text);}
  .btn-gold{background:var(--gold); color:#0B0B0D; border:1px solid var(--gold);}

  .breadcrumb{
    max-width:720px; margin:0 auto; padding:26px 5% 0;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-dim);
  }
  .breadcrumb a:hover{color:var(--gold);}

  .wrap{max-width:720px; margin:0 auto; padding:20px 5% 0;}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); margin-bottom:14px;}
  h1{font-size:clamp(28px,4vw,40px); line-height:1.1; margin-bottom:14px;}
  .lead{font-size:15.5px; color:var(--text-dim); line-height:1.65; margin-bottom:40px; max-width:480px;}

  /* ===== Contact cards ===== */
  .contact-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:56px;}
  .contact-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:16px;
    padding:28px 20px; text-align:center; transition:border-color 0.2s;
  }
  .contact-card:hover{border-color:rgba(217,164,65,0.3);}
  .contact-icon{
    width:52px; height:52px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--gold); color:var(--gold);
  }
  .contact-label{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px;}
  .contact-value{font-size:13.5px; font-weight:600; word-break:break-word;}
  .contact-value a:hover{color:var(--gold);}

  /* ===== Form ===== */
  .form-section-label{font-size:22px; margin-bottom:24px;}

  .field{margin-bottom:18px;}
  .field label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:9px;
  }
  .field input, .field textarea{
    width:100%; background:var(--bg-card); border:1px solid var(--line); border-radius:10px;
    padding:13px 15px; font-size:14.5px; color:var(--text); outline:none;
    font-family:'Inter',sans-serif; transition:border-color 0.2s;
  }
  .field input:focus, .field textarea:focus{border-color:var(--gold);}
  .field input::placeholder, .field textarea::placeholder{color:var(--text-dim);}
  .field textarea{resize:vertical; min-height:140px;}

  .submit-btn{
    width:100%; background:var(--gold); color:#0B0B0D; font-size:14.5px; font-weight:700;
    padding:14px; border-radius:100px; border:none; transition:background 0.2s;
    display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:100px;
  }
  .submit-btn:hover{background:#E5B45C;}
  .submit-btn:disabled{opacity:0.6; cursor:default;}

  .form-msg{font-size:13px; margin-bottom:16px; padding:12px 14px; border-radius:10px;}
  .form-msg.error{color:#E8697A; background:rgba(232,105,122,0.1); border:1px solid rgba(232,105,122,0.25);}
  .form-msg.success{color:var(--green); background:rgba(63,174,106,0.1); border:1px solid rgba(63,174,106,0.25);}

  .spinner{width:14px; height:14px; border:2px solid rgba(11,11,13,0.3); border-top-color:#0B0B0D; border-radius:50%; animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:640px){
    .contact-cards{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

  <nav>
    <div class="logo">MyGospelHub<span class="dot">.</span></div>
    <a href="index.html" class="btn btn-gold">Home</a>
  </nav>

  <div class="breadcrumb"><a href="index.html">Home</a> / Contact Us</div>

  <div class="wrap">
    <div class="eyebrow">Get in touch</div>
    <h1>Contact us</h1>
    <p class="lead">Got a question, a song to share, or something you want us to know? Reach out any way that works for you.</p>

    <div class="contact-cards">
      <div class="contact-card">
        <div class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" fill="none" stroke="none"/><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
        </div>
        <div class="contact-label">Email</div>
        <div class="contact-value"><a href="mailto:naijagospelhub@gmail.com">naijagospelhub@gmail.com</a></div>
      </div>
      <div class="contact-card">
        <div class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.4c1.4.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm5.9 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3.1s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.2.1.3 0 .5-.1.2-.1.3-.3.5-.1.2-.3.4-.4.5-.2.2-.3.3-.1.6.2.3.9 1.5 1.9 2.4 1.3 1.2 2.4 1.5 2.7 1.7.3.2.5.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.8.8.3.1.5.2.5.3.1.3.1.7-.1 1.4z"/></svg>
        </div>
        <div class="contact-label">WhatsApp</div>
        <div class="contact-value"><a href="https://wa.me/2347051978758" target="_blank" rel="noopener noreferrer">+234 705 197 8758</a></div>
      </div>
      <div class="contact-card">
        <div class="contact-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2C7.5 2 4 5.6 4 9.9c0 5.5 8 12.1 8 12.1s8-6.6 8-12.1C20 5.6 16.5 2 12 2z"/></svg>
        </div>
        <div class="contact-label">Follow &amp; Reach Us</div>
        <div class="contact-value">Nigeria · Online everywhere</div>
      </div>
    </div>

    <h2 class="form-section-label">Talk to us</h2>
    <div id="formMsg"></div>

    <form id="contactForm">
      <div class="field">
        <label for="name">Your name</label>
        <input type="text" id="name" placeholder="Full name" required>
      </div>
      <div class="field">
        <label for="email">Your email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="subject">Subject <span style="text-transform:none; color:var(--text-dim);">(optional)</span></label>
        <input type="text" id="subject" placeholder="What's this about?">
      </div>
      <div class="field">
        <label for="message">Your message</label>
        <textarea id="message" placeholder="Write your message here..." required></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Send message</button>
    </form>
  </div>

<script>
  const SUPABASE_URL = "https://kqgnpryubgdtmtcjtasi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxZ25wcnl1YmdkdG10Y2p0YXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTQ1NjQsImV4cCI6MjA5OTczMDU2NH0.T0y1CVCzIvfmK4vgczmlpiAFZP63MRLZT5eymu8R6jY";

  const form = document.getElementById("contactForm");
  const msgEl = document.getElementById("formMsg");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msgEl.innerHTML = "";

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!name || !email || !message) {
      msgEl.innerHTML = `<div class="form-msg error">Please fill in your name, email, and message.</div>`;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner"></span> Sending...`;

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/contact_messages`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ name, email, subject: subject || null, message }),
      });
      if (!res.ok) throw new Error("Failed to send");

      msgEl.innerHTML = `<div class="form-msg success">Thanks, ${name.split(" ")[0]}! Your message has been sent — we'll get back to you soon.</div>`;
      form.reset();
    } catch (err) {
      msgEl.innerHTML = `<div class="form-msg error">Something went wrong sending your message. Please try again.</div>`;
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "Send message";
  });
</script>

</body>
</html>
