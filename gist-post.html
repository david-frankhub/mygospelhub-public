<style>
  :root{
    --bg:#0B0B0D;
    --bg-raised:#141416;
    --bg-card:#18181B;
    --text:#F2EFE9;
    --text-dim:#8A8780;
    --gold:#D9A441;
    --wine:#7A1F2B;
    --wine-bright:#9C2C3A;
    --green:#3FAE6A;
    --line: rgba(242,239,233,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:#0B0B0D;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  button{font-family:inherit; cursor:pointer;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  /* ===== Nav ===== */
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 5%; position:sticky; top:0;
    background:rgba(11,11,13,0.85); backdrop-filter:blur(10px);
    z-index:100; border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Fraunces',serif; font-size:22px; font-weight:700; display:flex; align-items:baseline; gap:2px;}
  .logo .dot{color:var(--gold);}
  .nav-links{display:flex; gap:36px; font-size:14px; font-weight:500;}
  .nav-links a{color:var(--text-dim); transition:color 0.2s;}
  .nav-links a:hover{color:var(--text);}
  .btn{padding:10px 20px; border-radius:100px; font-size:13px; font-weight:600; border:1px solid var(--line); background:transparent; color:var(--text); transition:all 0.2s;}
  .btn-gold{background:var(--gold); color:#0B0B0D; border:1px solid var(--gold);}
  .btn-gold:hover{background:#E5B45C;}

  /* ===== Article layout ===== */
  .article-wrap{
    max-width:760px;
    margin:0 auto;
    padding:40px 5% 100px;
  }
  .breadcrumb{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-dim);
    margin-bottom:24px;
  }
  .breadcrumb a:hover{color:var(--gold);}

  .article-cat{
    display:inline-block;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase;
    background:var(--wine); color:#F2DCC9; padding:6px 12px; border-radius:100px;
    margin-bottom:18px;
  }
  .article-title{
    font-size:clamp(26px,4vw,40px);
    line-height:1.15;
    margin-bottom:18px;
  }
  .article-meta{
    display:flex; align-items:center; gap:14px;
    padding-bottom:24px; margin-bottom:28px;
    border-bottom:1px solid var(--line);
    font-size:12.5px; color:var(--text-dim);
  }
  .article-meta .dot-sep{opacity:0.5;}

  .article-cover{
    width:100%;
    border-radius:14px;
    background:#0f0f11;
    margin-bottom:28px;
    border:1px solid var(--line);
    overflow:hidden;
  }
  .article-cover img{width:100%; height:auto; max-height:80vh; object-fit:contain; display:block; margin:0 auto;}

  .article-body{
    font-size:16px; line-height:1.85; color:#E4E1DA;
    margin-bottom:32px;
    white-space:pre-wrap;
  }

  .stats-row{display:flex; gap:36px; margin-bottom:26px;}
  .stat{text-align:left;}
  .stat-value{font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--gold);}
  .stat-label{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-top:2px;}

  .article-actions{
    display:flex; gap:12px; flex-wrap:wrap;
    padding-bottom:32px; margin-bottom:32px;
    border-bottom:1px solid var(--line);
  }
  .action-like, .action-share{
    display:flex; align-items:center; gap:8px;
    padding:11px 20px; border-radius:100px;
    font-size:13.5px; font-weight:600; border:1px solid var(--line); background:var(--bg-card); color:var(--text);
    transition:all 0.2s;
  }
  .action-like svg, .action-share svg{width:15px; height:15px;}
  .action-like:hover{border-color:var(--gold);}
  .action-like.liked{color:var(--gold); border-color:var(--gold); background:rgba(217,164,65,0.08);}
  .action-share:hover{border-color:var(--text-dim);}

  /* ===== Related gist ===== */
  /* ===== Cards for related / recent lists (same look as the Music, Video and Gist pages) ===== */
  .tc-list{display:flex; flex-direction:column; gap:12px; margin-bottom:40px;}
  .track-card{display:grid; grid-template-columns:86px 1fr auto; align-items:center; gap:16px; padding:14px; border:1px solid var(--line); border-radius:16px; background:var(--bg-raised); transition:border-color .2s; cursor:pointer;}
  .track-card:hover{border-color:rgba(217,164,65,0.35);}
  .tc-art{width:86px; height:86px; border-radius:12px; background:linear-gradient(135deg, var(--wine-bright,#9C2C3A), #2A0810); background-size:cover; background-position:center;}
  .tc-body{min-width:0;}
  .tc-title{font-size:16px; font-weight:600; margin-bottom:4px; line-height:1.25; overflow-wrap:anywhere;}
  .tc-artist{font-size:13.5px; font-weight:700; color:var(--gold); margin-bottom:4px; overflow-wrap:anywhere;}
  .tc-meta{font-size:12.5px; color:var(--text-dim);}
  .tc-lock{font-size:12px; color:var(--gold); margin-top:4px; font-family:'JetBrains Mono',monospace;}
  .tc-actions{display:flex; gap:10px;}
  .tc-btn{width:50px; height:50px; border-radius:12px; border:1px solid var(--line); background:var(--bg-card,#18181B); color:var(--text); display:flex; align-items:center; justify-content:center; transition:all .2s; padding:0; cursor:pointer;}
  .tc-btn svg{width:20px; height:20px;}
  .tc-btn:hover{border-color:var(--gold); color:var(--gold);}
  .tc-btn.dl{border-color:rgba(217,164,65,0.45); color:var(--gold); background:rgba(217,164,65,0.07);}
  .tc-btn.dl:hover{background:rgba(217,164,65,0.16);}
  .tc-btn[disabled]{opacity:.35; cursor:not-allowed;}
  .gist-row{display:grid; grid-template-columns:96px 1fr auto; align-items:center; gap:16px; padding:12px; border:1px solid var(--line); border-radius:16px; background:var(--bg-raised); cursor:pointer; transition:border-color .2s;}
  .gist-row:hover{border-color:rgba(217,164,65,0.35);}
  .gr-art{width:96px; height:80px; border-radius:12px; background:linear-gradient(135deg, #9C2C3A, #2A0810); background-size:cover; background-position:center;}
  .gr-body{min-width:0;}
  .gr-cat{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); border:1px solid rgba(217,164,65,0.4); border-radius:100px; padding:3px 9px; margin-bottom:7px;}
  .gr-title{font-size:15.5px; font-weight:600; line-height:1.3; margin-bottom:5px; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .gr-meta{font-size:11.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .gr-go{width:40px; height:40px; border-radius:12px; border:1px solid rgba(217,164,65,0.45); background:rgba(217,164,65,0.07); color:var(--gold); display:flex; align-items:center; justify-content:center;}
  .gr-go svg{width:18px; height:18px;}
  @media (max-width:560px){
    .track-card{grid-template-columns:72px 1fr; row-gap:12px; padding:12px;}
    .tc-art{width:72px; height:72px;}
    .tc-actions{grid-column:1/-1; justify-content:flex-end;}
    .tc-btn{width:54px; height:44px;}
    .gist-row{grid-template-columns:84px 1fr; padding:10px;}
    .gr-art{width:84px; height:72px;}
    .gr-go{display:none;}
  }
  .related-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:18px;
  }
  .related-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:44px;}
  .related-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    cursor:pointer; transition:transform 0.2s, border-color 0.2s;
  }
  .related-card:hover{transform:translateY(-3px); border-color:rgba(217,164,65,0.3);}
  .related-cover{aspect-ratio:16/10; background:linear-gradient(135deg,#262629,#17171a);}
  .related-cover img{width:100%; height:100%; object-fit:cover; display:block;}
  .related-body{padding:14px;}
  .related-title{font-size:13.5px; font-weight:600; line-height:1.4;}

  /* ===== Recent Posts + Follow Us ===== */
  .recent-posts-list{display:flex; flex-direction:column; margin-bottom:40px;}
  .recent-post-row{
    display:grid; grid-template-columns:52px 1fr; align-items:center; gap:16px;
    padding:12px 10px; border-radius:10px; cursor:pointer; transition:background 0.2s;
  }
  .recent-post-row:hover{background:var(--bg-card);}
  .recent-post-art{width:52px; height:52px; border-radius:8px; background:linear-gradient(135deg, var(--wine-bright), #2A0810); flex-shrink:0; overflow:hidden;}
  .recent-post-art img{width:100%; height:100%; object-fit:cover;}
  .recent-post-title{font-size:14.5px; font-weight:600; margin-bottom:2px;}
  .recent-post-date{font-size:12px; color:var(--text-dim);}

  .follow-us{text-align:center; padding-top:8px;}
  .follow-us .related-label{text-align:center;}
  .follow-icons{display:flex; justify-content:center; gap:14px;}
  .follow-icon{
    width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--text);
    transition:all 0.2s;
  }
  .follow-icon:hover{border-color:var(--gold); color:var(--gold); background:rgba(217,164,65,0.08);}
  .follow-icon[aria-label="Facebook"]{color:#1877F2;}
  .follow-icon[aria-label="Instagram"]{color:#E1306C;}
  .follow-icon[aria-label="TikTok"]{color:#FFFFFF;}
  .follow-icon[aria-label="Facebook"]:hover{color:#1877F2; border-color:#1877F2; background:rgba(24,119,242,0.12);}
  .follow-icon[aria-label="Instagram"]:hover{color:#E1306C; border-color:#E1306C; background:rgba(225,48,108,0.12);}
  .follow-icon[aria-label="TikTok"]:hover{color:#FFFFFF; border-color:#FFFFFF; background:rgba(255,255,255,0.1);}

  /* ===== Comments ===== */
  .comments-section{padding-top:8px;}
  .comments-head{font-size:18px; font-weight:600; margin-bottom:20px; display:flex; align-items:center; gap:10px;}
  .comments-head .count{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-dim); font-weight:500;}

  .comment-form{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:28px;
  }
  .comment-form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .comment-form input, .comment-form textarea{
    width:100%; background:var(--bg-raised); border:1px solid var(--line); border-radius:9px;
    padding:11px 13px; font-size:13.5px; color:var(--text); outline:none;
    font-family:'Inter',sans-serif; transition:border-color 0.2s;
  }
  .comment-form input:focus, .comment-form textarea:focus{border-color:var(--gold);}
  .comment-form input::placeholder, .comment-form textarea::placeholder{color:var(--text-dim);}
  .comment-form textarea{resize:vertical; min-height:80px; margin-bottom:14px;}
  .comment-form-foot{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .comment-hint{font-size:11.5px; color:var(--text-dim);}
  .comment-submit{
    background:var(--gold); color:#0B0B0D; font-size:13.5px; font-weight:700;
    padding:10px 22px; border-radius:100px; border:none; transition:background 0.2s;
  }
  .comment-submit:hover{background:#E5B45C;}
  .comment-submit:disabled{opacity:0.6; cursor:default;}
  .comment-error{font-size:12.5px; color:#E8697A; margin-bottom:12px;}
  .comment-success{font-size:12.5px; color:var(--green); margin-bottom:12px;}

  .comment-list{display:flex; flex-direction:column; gap:18px;}
  .comment{display:flex; gap:12px;}
  .comment-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--gold), #B87A2E);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:14px; color:#0B0B0D;
  }
  .comment-body{flex:1; min-width:0;}
  .comment-name{font-size:13.5px; font-weight:700;}
  .comment-name span{color:var(--text-dim); font-weight:400; font-size:11px; margin-left:8px; font-family:'JetBrains Mono',monospace;}
  .comment-text{font-size:13.5px; color:#D8D5CE; line-height:1.55; margin-top:3px; word-wrap:break-word;}

  .state-block{
    text-align:center; padding:32px 20px; color:var(--text-dim); font-size:13.5px;
    background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
  }
  .page-empty{ text-align:center; padding:100px 20px; }
  .page-empty h2{font-size:22px; margin-bottom:10px;}
  .page-empty p{color:var(--text-dim); font-size:14px;}

  @media (max-width:640px){
    .nav-links{display:none;}
    .related-grid{grid-template-columns:1fr;}
    .comment-form-row{grid-template-columns:1fr;}
    .article-actions{flex-direction:column;}
  }
</style>
</head>
