<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song — MyGospelHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D;
    --bg-raised:#141416;
    --bg-card:#18181B;
    --text:#F2EFE9;
    --text-dim:#8A8780;
    --gold:#D9A441;
    --wine:#7A1F2B;
    --wine-bright:#9C2C3A;
    --green:#3FAE6A;
    --line: rgba(242,239,233,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:#0B0B0D;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  button{font-family:inherit; cursor:pointer;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  /* ===== Nav ===== */
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 5%; position:sticky; top:0;
    background:rgba(11,11,13,0.85); backdrop-filter:blur(10px);
    z-index:100; border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Fraunces',serif; font-size:22px; font-weight:700; display:flex; align-items:baseline; gap:2px;}
  .logo .dot{color:var(--gold);}
  .nav-links{display:flex; gap:36px; font-size:14px; font-weight:500;}
  .nav-links a{color:var(--text-dim); transition:color 0.2s;}
  .nav-links a:hover{color:var(--text);}
  .btn{padding:10px 20px; border-radius:100px; font-size:13px; font-weight:600; border:1px solid var(--line); background:transparent; color:var(--text); transition:all 0.2s;}
  .btn-gold{background:var(--gold); color:#0B0B0D; border:1px solid var(--gold);}
  .btn-gold:hover{background:#E5B45C;}

  /* ===== Song layout ===== */
  .song-wrap{
    max-width:900px;
    margin:0 auto;
    padding:40px 5% 100px;
  }
  .breadcrumb{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-dim);
    margin-bottom:24px;
  }
  .breadcrumb a:hover{color:var(--gold);}

  .song-header{
    display:flex; gap:26px; margin-bottom:28px;
  }
  .song-cover{
    width:160px; height:160px; border-radius:16px; flex-shrink:0;
    background:linear-gradient(135deg, var(--wine-bright), #2A0810);
    border:1px solid var(--line);
    background-size:cover; background-position:center;
  }
  .song-tags{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .song-tag{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase;
    padding:5px 11px; border-radius:100px; background:var(--bg-raised); color:var(--gold);
    border:1px solid var(--line);
  }
  .song-title{font-size:clamp(24px,4vw,34px); line-height:1.15; margin-bottom:8px;}
  .song-artist{font-size:16px; color:var(--text-dim); font-weight:500;}

  .song-desc{
    font-size:14.5px; color:#D8D5CE; line-height:1.7;
    margin-bottom:28px;
    padding-bottom:28px;
    border-bottom:1px solid var(--line);
  }

  /* ===== Stats + actions (referenced layout) ===== */
  .stats-row{
    display:flex; gap:44px;
    margin-bottom:22px;
  }
  .stat{text-align:left;}
  .stat-num{font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--gold);}
  .stat-label{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-top:2px;}

  .action-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .action-btn{
    display:flex; align-items:center; gap:9px;
    padding:13px 22px; border-radius:100px;
    font-size:14px; font-weight:700; border:none;
    transition:all 0.2s;
  }
  .action-btn.download{background:var(--gold); color:#0B0B0D;}
  .action-btn.download:hover{background:#E5B45C;}
  .action-btn.stream{background:rgba(63,174,106,0.12); color:var(--green); border:1px solid rgba(63,174,106,0.3);}
  .action-btn.stream:hover{background:rgba(63,174,106,0.2);}
  .action-btn.like{background:var(--bg-card); color:var(--text); border:1px solid var(--line); padding:13px 18px;}
  .action-btn.like:hover{border-color:var(--gold);}
  .action-btn.like.liked{color:var(--gold); border-color:var(--gold); background:rgba(217,164,65,0.08);}
  .action-btn.share{background:var(--bg-card); color:var(--text); border:1px solid var(--line);}
  .action-btn.share:hover{border-color:var(--text-dim);}
  .action-row-2{display:flex; gap:12px; margin-bottom:32px;}

  /* ===== Inline player (only shown when a real file exists) ===== */
  .inline-player{
    display:none;
    align-items:center; gap:14px;
    background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:32px;
  }
  .inline-player.show{display:flex;}
  .inline-player .thumb{width:40px; height:40px; border-radius:8px; background:linear-gradient(135deg,var(--gold),#B87A2E); flex-shrink:0; background-size:cover; background-position:center;}
  .inline-player .play-btn{
    width:32px; height:32px; border-radius:50%; background:var(--gold); color:#0B0B0D;
    display:flex; align-items:center; justify-content:center; border:none; flex-shrink:0;
  }
  .inline-player .progress{flex:1; height:3px; border-radius:2px; background:rgba(242,239,233,0.15); position:relative;}
  .inline-player .progress-fill{position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--gold); border-radius:2px;}
  .inline-player .time{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap;}

  /* ===== Related songs ===== */
  .related-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:16px;
  }
  .related-list{display:flex; flex-direction:column; margin-bottom:44px;}
  .related-row{
    display:grid; grid-template-columns:52px 1fr auto; align-items:center; gap:14px;
    padding:11px 8px; border-radius:10px; cursor:pointer; transition:background 0.2s;
  }
  .related-row:hover{background:var(--bg-card);}
  .related-thumb{width:52px; height:52px; border-radius:8px; background:linear-gradient(135deg, var(--wine-bright), #2A0810); background-size:cover; background-position:center;}
  .related-title{font-size:14px; font-weight:600; margin-bottom:2px;}
  .related-artist{font-size:12px; color:var(--text-dim);}
  .related-plays{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-dim);}

  /* ===== Comments ===== */
  .comments-section{padding-top:32px; border-top:1px solid var(--line);}
  .comments-head{font-size:18px; font-weight:600; margin-bottom:20px; display:flex; align-items:center; gap:10px;}
  .comments-head .count{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-dim); font-weight:500;}

  .comment-form{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:28px;
  }
  .comment-form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .comment-form input, .comment-form textarea{
    width:100%; background:var(--bg-raised); border:1px solid var(--line); border-radius:9px;
    padding:11px 13px; font-size:13.5px; color:var(--text); outline:none;
    font-family:'Inter',sans-serif; transition:border-color 0.2s;
  }
  .comment-form input:focus, .comment-form textarea:focus{border-color:var(--gold);}
  .comment-form input::placeholder, .comment-form textarea::placeholder{color:var(--text-dim);}
  .comment-form textarea{resize:vertical; min-height:80px; margin-bottom:14px;}
  .comment-form-foot{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .comment-hint{font-size:11.5px; color:var(--text-dim);}
  .comment-submit{
    background:var(--gold); color:#0B0B0D; font-size:13.5px; font-weight:700;
    padding:10px 22px; border-radius:100px; border:none; transition:background 0.2s;
    display:flex; align-items:center; gap:8px;
  }
  .comment-submit:hover{background:#E5B45C;}
  .comment-submit:disabled{opacity:0.6; cursor:default;}
  .comment-error{font-size:12.5px; color:#E8697A; margin-bottom:12px;}
  .comment-success{font-size:12.5px; color:var(--green); margin-bottom:12px;}

  .comment-list{display:flex; flex-direction:column; gap:18px;}
  .comment{display:flex; gap:12px;}
  .comment-avatar{
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--gold), #B87A2E);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:14px; color:#0B0B0D;
  }
  .comment-body{flex:1; min-width:0;}
  .comment-name{font-size:13.5px; font-weight:700;}
  .comment-name span{color:var(--text-dim); font-weight:400; font-size:11px; margin-left:8px; font-family:'JetBrains Mono',monospace;}
  .comment-text{font-size:13.5px; color:#D8D5CE; line-height:1.55; margin-top:3px; word-wrap:break-word;}

  .comments-empty{
    text-align:center; padding:32px 20px; color:var(--text-dim); font-size:13.5px;
    background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
  }
  .comments-loading{text-align:center; padding:20px; color:var(--text-dim); font-size:13px;}

  .page-empty{ text-align:center; padding:100px 20px; }
  .page-empty h2{font-size:22px; margin-bottom:10px;}
  .page-empty p{color:var(--text-dim); font-size:14px;}

  @media (max-width:640px){
    .nav-links{display:none;}
    .song-header{flex-direction:column; align-items:flex-start;}
    .song-cover{width:100%; height:200px;}
    .stats-row{gap:32px;}
    .action-row, .action-row-2{flex-direction:column;}
    .action-btn{justify-content:center;}
    .comment-form-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

  <nav>
    <div class="logo">MyGospelHub<span class="dot">.</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#videos">Videos</a>
      <a href="music.html">Music</a>
      <a href="index.html#gist">Gist</a>
    </div>
    <a href="index.html" class="btn btn-gold">Home</a>
  </nav>

  <div class="song-wrap" id="songWrap">
    <div class="comments-loading">Loading song…</div>
  </div>

<script>
  const SUPABASE_URL = "https://kqgnpryubgdtmtcjtasi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxZ25wcnl1YmdkdG10Y2p0YXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTQ1NjQsImV4cCI6MjA5OTczMDU2NH0.T0y1CVCzIvfmK4vgczmlpiAFZP63MRLZT5eymu8R6jY";

  async function supabaseQuery(table, params) {
    const url = `${SUPABASE_URL}/rest/v1/${table}?${params}`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Failed to load ${table}`);
    return res.json();
  }

  async function supabaseInsert(table, body) {
    const url = `${SUPABASE_URL}/rest/v1/${table}`;
    const res = await fetch(url, {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=representation",
      },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`Failed to save to ${table}`);
    return res.json();
  }

  async function supabaseRpc(fn, args) {
    const url = `${SUPABASE_URL}/rest/v1/rpc/${fn}`;
    const res = await fetch(url, {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(args),
    });
    return res.ok;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function formatCount(n) {
    n = n || 0;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  function timeAgo(dateString) {
    if (!dateString) return "";
    const diff = Date.now() - new Date(dateString).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    const days = Math.floor(hrs / 24);
    return days + "d ago";
  }

  const params = new URLSearchParams(window.location.search);
  const songId = params.get("id");
  const songWrap = document.getElementById("songWrap");
  let currentSong = null;
  let liked = false;

  function renderNotFound() {
    songWrap.innerHTML = `
      <div class="page-empty">
        <h2>Song not found</h2>
        <p>This track may have been removed, or the link is incorrect.</p>
      </div>`;
  }

  function renderSong(song) {
    currentSong = song;
    document.title = `${song.title} — MyGospelHub`;

    const hasFile = Boolean(song.file_url);
    const hasStream = Boolean(song.streaming_link);
    const coverStyle = song.cover_url ? `background-image:url('${escapeHtml(song.cover_url)}')` : "";

    songWrap.innerHTML = `
      <div class="breadcrumb"><a href="index.html">Home</a> / <a href="music.html">Music</a> / ${escapeHtml(song.title)}</div>

      <div class="song-header">
        <div class="song-cover" style="${coverStyle}"></div>
        <div>
          <div class="song-tags">
            ${song.genre ? `<span class="song-tag">${escapeHtml(song.genre)}</span>` : ""}
            ${song.year ? `<span class="song-tag">${escapeHtml(String(song.year))}</span>` : ""}
          </div>
          <h1 class="song-title">${escapeHtml(song.title)}</h1>
          <div class="song-artist">${escapeHtml(song.artist)}</div>
        </div>
      </div>

      ${song.description ? `<p class="song-desc">${escapeHtml(song.description)}</p>` : ""}

      <div class="stats-row">
        <div class="stat"><div class="stat-num" id="statPlays">${formatCount(song.views)}</div><div class="stat-label">Plays</div></div>
        <div class="stat"><div class="stat-num" id="statDownloads">${formatCount(song.downloads)}</div><div class="stat-label">Downloads</div></div>
        <div class="stat"><div class="stat-num" id="statLikes">${formatCount(song.likes)}</div><div class="stat-label">Likes</div></div>
      </div>

      <div class="action-row">
        ${hasFile ? `<button class="action-btn download" id="downloadBtn">⬇ Download</button>` : ""}
        ${(hasFile || hasStream) ? `<button class="action-btn stream" id="streamBtn">▶ ${hasFile ? "Stream" : "Stream on platform"}</button>` : ""}
        <button class="action-btn like" id="likeBtn">♡ <span id="likeBtnCount">${formatCount(song.likes)}</span></button>
      </div>
      <div class="action-row-2">
        <button class="action-btn share" id="shareBtn">⇢ Share</button>
      </div>

      <div class="inline-player" id="inlinePlayer">
        <div class="thumb" style="${coverStyle}"></div>
        <button class="play-btn" id="inlinePlayBtn">▶</button>
        <div class="progress"><div class="progress-fill"></div></div>
        <span class="time">${song.type === "Audio" ? "0:00" : ""}</span>
      </div>

      <div id="relatedWrap"></div>

      <div class="comments-section">
        <div class="comments-head">Comments <span class="count" id="commentCount"></span></div>

        <div class="comment-form">
          <div id="commentMsg"></div>
          <div class="comment-form-row">
            <input type="text" id="commentName" placeholder="Your name" maxlength="60">
            <input type="email" id="commentEmail" placeholder="Email (optional)" maxlength="120">
          </div>
          <textarea id="commentText" placeholder="Share your thoughts on this track…" maxlength="600"></textarea>
          <div class="comment-form-foot">
            <span class="comment-hint">No account needed</span>
            <button class="comment-submit" id="commentSubmit">Post comment</button>
          </div>
        </div>

        <div class="comment-list" id="commentList">
          <div class="comments-loading">Loading comments…</div>
        </div>
      </div>
    `;

    wireActions(song, hasFile, hasStream);
    loadRelated(song);
    loadComments(song.id);
    wireCommentForm(song.id);
  }

  function wireActions(song, hasFile, hasStream) {
    const downloadBtn = document.getElementById("downloadBtn");
    const streamBtn = document.getElementById("streamBtn");
    const likeBtn = document.getElementById("likeBtn");
    const shareBtn = document.getElementById("shareBtn");
    const inlinePlayer = document.getElementById("inlinePlayer");

    if (downloadBtn) {
      downloadBtn.addEventListener("click", async () => {
        await supabaseRpc("increment_downloads", { row_id: song.id });
        const el = document.getElementById("statDownloads");
        el.textContent = formatCount((song.downloads || 0) + 1);
        song.downloads = (song.downloads || 0) + 1;
        window.open(song.file_url, "_blank");
      });
    }

    if (streamBtn) {
      streamBtn.addEventListener("click", async () => {
        await supabaseRpc("increment_views", { row_id: song.id });
        if (hasFile) {
          inlinePlayer.classList.add("show");
          inlinePlayer.scrollIntoView({ behavior: "smooth", block: "center" });
        } else {
          window.open(song.streaming_link, "_blank");
        }
      });
    }

    likeBtn.addEventListener("click", async () => {
      if (liked) return; // one like per page view, keeps it simple and honest
      liked = true;
      likeBtn.classList.add("liked");
      await supabaseRpc("increment_likes", { row_id: song.id });
      const newCount = (song.likes || 0) + 1;
      song.likes = newCount;
      document.getElementById("statLikes").textContent = formatCount(newCount);
      document.getElementById("likeBtnCount").textContent = formatCount(newCount);
    });

    shareBtn.addEventListener("click", async () => {
      const url = window.location.href;
      if (navigator.share) {
        try { await navigator.share({ title: song.title, text: `${song.title} — ${song.artist}`, url }); }
        catch (e) { /* user cancelled, ignore */ }
      } else {
        await navigator.clipboard.writeText(url);
        shareBtn.textContent = "✓ Link copied";
        setTimeout(() => { shareBtn.innerHTML = "⇢ Share"; }, 1800);
      }
    });
  }

  async function loadRelated(song) {
    const wrap = document.getElementById("relatedWrap");
    try {
      const results = await supabaseQuery(
        "content",
        `status=eq.Published&type=eq.${encodeURIComponent(song.type)}&id=neq.${song.id}&order=views.desc&limit=4`
      );
      if (!results || results.length === 0) { wrap.innerHTML = ""; return; }
      wrap.innerHTML = `
        <div class="related-label">You might also like</div>
        <div class="related-list">
          ${results.map(r => `
            <div class="related-row" onclick="window.location.href='song.html?id=${r.id}'">
              <div class="related-thumb" style="${r.cover_url ? `background-image:url('${escapeHtml(r.cover_url)}')` : ""}"></div>
              <div>
                <div class="related-title">${escapeHtml(r.title)}</div>
                <div class="related-artist">${escapeHtml(r.artist)}</div>
              </div>
              <div class="related-plays">${formatCount(r.views)} plays</div>
            </div>
          `).join("")}
        </div>
      `;
    } catch (e) {
      wrap.innerHTML = "";
    }
  }

  async function loadComments(contentId) {
    const list = document.getElementById("commentList");
    const countEl = document.getElementById("commentCount");
    try {
      const comments = await supabaseQuery(
        "comments",
        `content_id=eq.${contentId}&status=eq.Visible&order=created_at.desc`
      );
      countEl.textContent = comments.length ? `(${comments.length})` : "";
      if (!comments || comments.length === 0) {
        list.innerHTML = `<div class="comments-empty">Be the first to comment on this track.</div>`;
        return;
      }
      list.innerHTML = comments.map(c => {
        const name = c.guest_name || "Anonymous";
        const initial = name.trim().charAt(0).toUpperCase() || "A";
        return `
          <div class="comment">
            <div class="comment-avatar">${initial}</div>
            <div class="comment-body">
              <div class="comment-name">${escapeHtml(name)} <span>${timeAgo(c.created_at)}</span></div>
              <div class="comment-text">${escapeHtml(c.text)}</div>
            </div>
          </div>`;
      }).join("");
    } catch (e) {
      list.innerHTML = `<div class="comments-empty">Couldn't load comments right now.</div>`;
    }
  }

  function wireCommentForm(contentId) {
    const submitBtn = document.getElementById("commentSubmit");
    const nameInput = document.getElementById("commentName");
    const emailInput = document.getElementById("commentEmail");
    const textInput = document.getElementById("commentText");
    const msg = document.getElementById("commentMsg");

    submitBtn.addEventListener("click", async () => {
      msg.innerHTML = "";
      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const text = textInput.value.trim();

      if (!name || !text) {
        msg.innerHTML = `<div class="comment-error">Please add your name and a comment.</div>`;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Posting…";

      try {
        await supabaseInsert("comments", {
          content_id: contentId,
          guest_name: name,
          guest_email: email || null,
          text: text,
          status: "Visible",
        });
        nameInput.value = "";
        emailInput.value = "";
        textInput.value = "";
        msg.innerHTML = `<div class="comment-success">Comment posted!</div>`;
        loadComments(contentId);
      } catch (e) {
        msg.innerHTML = `<div class="comment-error">Couldn't post your comment. Please try again.</div>`;
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "Post comment";
    });
  }

  async function init() {
    if (!songId) {
      renderNotFound();
      return;
    }
    try {
      const results = await supabaseQuery("content", `id=eq.${songId}&status=eq.Published&limit=1`);
      if (!results || results.length === 0) {
        renderNotFound();
        return;
      }
      renderSong(results[0]);
      supabaseRpc("increment_views", { row_id: songId }); // count the visit as a play/view
    } catch (e) {
      renderNotFound();
    }
  }

  init();
</script>

</body>
</html>
