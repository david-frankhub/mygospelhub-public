<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D;
    --bg-raised:#141416;
    --bg-card:#18181B;
    --text:#F2EFE9;
    --text-dim:#8A8780;
    --gold:#D9A441;
    --wine:#7A1F2B;
    --wine-bright:#9C2C3A;
    --line: rgba(242,239,233,0.08);
    --green:#3FAE5A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:#0B0B0D;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  button{font-family:inherit; cursor:pointer;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  /* ===== Nav ===== */
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 5%; position:sticky; top:0;
    background:rgba(11,11,13,0.85); backdrop-filter:blur(10px);
    z-index:100; border-bottom:1px solid var(--line);
  }
  .logo{font-family:'Fraunces',serif; font-size:22px; font-weight:700; display:flex; align-items:baseline; gap:2px;}
  .logo .dot{color:var(--gold);}
  .nav-links{display:flex; gap:36px; font-size:14px; font-weight:500;}
  .nav-links a{color:var(--text-dim); transition:color 0.2s;}
  .nav-links a:hover{color:var(--text);}
  .btn{padding:10px 20px; border-radius:100px; font-size:13px; font-weight:600; border:1px solid var(--line); background:transparent; color:var(--text); transition:all 0.2s;}
  .btn-gold{background:var(--gold); color:#0B0B0D; border:1px solid var(--gold);}
  .btn-gold:hover{background:#E5B45C;}

  /* ===== Layout ===== */
  .song-wrap{max-width:900px; margin:0 auto; padding:40px 5% 100px;}
  .breadcrumb{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-dim);
    display:flex; align-items:center; gap:8px; margin-bottom:28px;
  }
  .breadcrumb a:hover{color:var(--gold);}
  .breadcrumb .sep{opacity:0.4;}

  .song-header{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:28px;
    margin-bottom:28px;
  }
  .song-cover{
    aspect-ratio:1;
    border-radius:16px;
    background:linear-gradient(135deg, var(--wine-bright), #2A0810);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .song-cover img{width:100%; height:100%; object-fit:cover;}
  .song-tags{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .song-tag{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase;
    padding:5px 11px; border-radius:100px; background:var(--bg-card); color:var(--gold);
    border:1px solid var(--line);
  }
  .song-title{font-size:clamp(24px,3.6vw,36px); line-height:1.15; margin-bottom:10px;}
  .song-artist{font-size:16px; color:var(--gold); font-weight:600; margin-bottom:16px;}
  .yt-card{width:100%; aspect-ratio:16/9; border-radius:14px; background:#000; border:1px solid var(--line); margin:0 0 12px; overflow:hidden;}
  .yt-note{font-size:12px; color:var(--text-dim); margin:0 0 22px;}
  .yt-note a{color:var(--gold);}
  .posted-by{font-size:13px; color:var(--text-dim); margin-bottom:16px; display:flex; flex-wrap:wrap; align-items:center; gap:8px;}
  .posted-by strong{color:var(--gold); font-weight:600;}
  .posted-by .pb-dot{opacity:.5;}
  .details-card{margin:0 0 26px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--bg-raised);}
  .details-head{padding:14px 18px; border-left:3px solid var(--gold); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text);}
  .detail-row{display:flex; gap:14px; padding:12px 18px; border-top:1px solid var(--line); font-size:14px;}
  .detail-label{flex:0 0 118px; color:var(--text-dim);}
  .detail-value{color:var(--text); font-weight:500; min-width:0; overflow-wrap:anywhere;}
  .song-producer{font-size:13px; color:var(--text-dim); margin-top:-10px; margin-bottom:16px;}
  .song-desc{font-size:14px; color:var(--text-dim); line-height:1.65; max-width:520px;}

  /* ===== Lyrics ===== */
  .lyrics-section{
    margin-bottom:32px;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    background:var(--bg-card);
  }
  .lyrics-toggle{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
    background:none; border:none;
    font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:var(--text);
  }
  .lyrics-toggle svg{transition:transform 0.25s ease; color:var(--text-dim); flex-shrink:0;}
  .lyrics-body{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.3s ease, padding 0.3s ease;
    padding:0 20px;
    font-size:14.5px; line-height:1.9; color:#D8D5CE;
    white-space:pre-wrap;
    border-top:1px solid transparent;
  }
  .lyrics-body.open{
    max-height:2000px;
    padding:4px 20px 22px;
    border-top-color:var(--line);
  }

  /* ===== Stats ===== */
  .stats-row{
    display:flex; gap:40px; padding:24px 0;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    margin-bottom:24px;
  }
  .stat{}
  .stat-value{font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--gold);}
  .stat-label{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); margin-top:2px;}

  /* ===== Actions ===== */
  /* ===== Inline audio player ===== */
  .inline-player{
    display:flex; align-items:center; gap:14px;
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:18px;
  }
  .inline-play-btn{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:var(--gold); color:#0B0B0D; border:none;
    display:flex; align-items:center; justify-content:center;
  }
  .inline-play-btn svg{width:16px; height:16px;}
  .inline-player-body{flex:1; min-width:0;}
  .inline-progress{
    height:5px; border-radius:3px; background:rgba(242,239,233,0.15);
    position:relative; cursor:pointer; margin-bottom:8px;
  }
  .inline-progress-fill{position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--gold); border-radius:3px;}
  .inline-time{display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);}

  .actions-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .action-btn{
    display:flex; align-items:center; gap:9px;
    padding:14px 24px; border-radius:100px;
    font-size:14.5px; font-weight:700;
    border:none; transition:all 0.2s;
  }
  .action-btn svg{width:17px; height:17px;}
  .release-box{
    position:relative; overflow:hidden; isolation:isolate;
    margin-bottom:18px; padding:22px 16px 18px; text-align:center;
    border-radius:20px;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(217,164,65,0.18), transparent 60%),
      linear-gradient(160deg, #241418 0%, #17110f 55%, #120f0c 100%);
    border:1px solid rgba(217,164,65,0.38);
    box-shadow:0 12px 40px -12px rgba(217,164,65,0.28), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .release-box::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background:var(--cover) center/cover no-repeat;
    opacity:0.14; filter:blur(18px) saturate(1.2); transform:scale(1.2);
  }
  .release-box::after{
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; z-index:-1;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.07), transparent);
    animation:rbShine 6s ease-in-out infinite;
  }
  @keyframes rbShine{0%,55%{left:-60%;}100%{left:130%;}}
  .rb-pill{
    display:inline-flex; align-items:center; gap:8px;
    padding:6px 13px; border-radius:100px; margin-bottom:10px;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--gold); background:rgba(217,164,65,0.1); border:1px solid rgba(217,164,65,0.3);
  }
  .rb-dot{width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 0 rgba(217,164,65,0.6); animation:rbPulse 1.8s infinite;}
  @keyframes rbPulse{0%{box-shadow:0 0 0 0 rgba(217,164,65,0.55);}70%{box-shadow:0 0 0 9px rgba(217,164,65,0);}100%{box-shadow:0 0 0 0 rgba(217,164,65,0);}}
  .release-label{font-family:'Fraunces',serif; font-size:21px; font-weight:600; color:var(--text); margin-bottom:16px; letter-spacing:0.01em;}
  .release-label em{font-style:italic; color:var(--gold); font-weight:500;}
  .countdown{display:flex; align-items:flex-start; justify-content:center; gap:6px;}
  .cd-unit{
    flex:1 1 0; max-width:76px; padding:12px 4px 9px; border-radius:14px;
    background:linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.09);
    box-shadow:0 6px 16px -8px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.07);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .cd-unit.cd-days{border-color:rgba(217,164,65,0.45); background:linear-gradient(180deg, rgba(217,164,65,0.2), rgba(217,164,65,0.05));}
  .cd-num{
    font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:500; line-height:1.1; color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .cd-days .cd-num{color:#F4CF85;}
  .cd-num.tick{animation:cdTick .35s ease-out;}
  @keyframes cdTick{0%{transform:translateY(-6px); opacity:0.2;}100%{transform:none; opacity:1;}}
  .cd-lbl{font-size:9.5px; text-transform:uppercase; letter-spacing:0.14em; color:var(--text-dim); margin-top:5px;}
  .cd-sep{align-self:flex-start; padding-top:12px; font-family:'JetBrains Mono',monospace; font-size:24px; color:rgba(217,164,65,0.55); animation:rbBlink 1s steps(2,start) infinite;}
  @keyframes rbBlink{50%{opacity:0.2;}}
  .rb-progress{height:5px; border-radius:5px; background:rgba(255,255,255,0.08); margin:18px 6px 0; overflow:hidden;}
  .rb-bar{height:100%; width:0; border-radius:5px; background:linear-gradient(90deg, var(--wine-bright), var(--gold)); transition:width .8s ease;}
  .rb-progress-note{font-size:11px; color:var(--text-dim); margin-top:7px; letter-spacing:0.03em;}
  .release-date-text{
    display:inline-flex; align-items:center; gap:8px; margin-top:14px;
    padding:8px 14px; border-radius:100px; font-size:12.5px; color:var(--text);
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
  }
  .release-date-text svg{width:14px; height:14px; color:var(--gold); flex:none;}
  @media (prefers-reduced-motion:reduce){
    .release-box::after,.rb-dot,.cd-sep,.cd-num.tick{animation:none;}
  }
  .action-locked{background:var(--bg-raised); color:var(--text-dim); border:1px dashed var(--line); cursor:not-allowed;}
  .action-download{background:var(--gold); color:#0B0B0D;}
  .action-download:hover{background:#E5B45C;}
  .action-stream{background:rgba(63,174,90,0.12); color:var(--green); border:1px solid rgba(63,174,90,0.3);}
  .action-stream:hover{background:rgba(63,174,90,0.2);}
  .action-like{
    display:flex; align-items:center; gap:7px;
    padding:14px 20px; border-radius:100px;
    background:var(--bg-card); color:var(--text); border:1px solid var(--line);
    font-size:14.5px; font-weight:700;
  }
  .action-like svg{width:16px; height:16px;}
  .action-like.liked{color:var(--gold); border-color:rgba(217,164,65,0.4);}
  .action-like.liked svg{fill:var(--gold);}
  .action-share{
    display:flex; align-items:center; gap:9px;
    padding:14px 22px; border-radius:100px;
    background:var(--bg-card); color:var(--text-dim); border:1px solid var(--line);
    font-size:14px; font-weight:600;
  }
  .action-share:hover{color:var(--text);}
  .action-share svg{width:15px; height:15px;}

  /* ===== Related ===== */
  section.related{margin-top:56px;}
  .section-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-dim); margin-bottom:18px;
  }
  /* ===== Cards used for More like this / Recent Posts (same look as the Music page) ===== */
  .tc-list{display:flex; flex-direction:column; gap:12px; margin-bottom:40px;}
  .track-card{display:grid; grid-template-columns:86px 1fr auto; align-items:center; gap:16px; padding:14px; border:1px solid var(--line); border-radius:16px; background:var(--bg-raised); transition:border-color .2s; cursor:pointer;}
  .track-card:hover{border-color:rgba(217,164,65,0.35);}
  .tc-art{width:86px; height:86px; border-radius:12px; background:linear-gradient(135deg, var(--wine-bright,#9C2C3A), #2A0810); background-size:cover; background-position:center;}
  .tc-body{min-width:0;}
  .tc-title{font-size:16px; font-weight:600; margin-bottom:4px; line-height:1.25; overflow-wrap:anywhere;}
  .tc-artist{font-size:13.5px; font-weight:700; color:var(--gold); margin-bottom:4px; overflow-wrap:anywhere;}
  .tc-meta{font-size:12.5px; color:var(--text-dim);}
  .tc-lock{font-size:12px; color:var(--gold); margin-top:4px; font-family:'JetBrains Mono',monospace;}
  .tc-actions{display:flex; gap:10px;}
  .tc-btn{width:50px; height:50px; border-radius:12px; border:1px solid var(--line); background:var(--bg-card,#18181B); color:var(--text); display:flex; align-items:center; justify-content:center; transition:all .2s; padding:0; cursor:pointer;}
  .tc-btn svg{width:20px; height:20px;}
  .tc-btn:hover{border-color:var(--gold); color:var(--gold);}
  .tc-btn.dl{border-color:rgba(217,164,65,0.45); color:var(--gold); background:rgba(217,164,65,0.07);}
  .tc-btn.dl:hover{background:rgba(217,164,65,0.16);}
  .tc-btn[disabled]{opacity:.35; cursor:not-allowed;}
  @media (max-width:560px){
    .track-card{grid-template-columns:72px 1fr; row-gap:12px; padding:12px;}
    .tc-art{width:72px; height:72px;}
    .tc-actions{grid-column:1/-1; justify-content:flex-end;}
    .tc-btn{width:54px; height:44px;}
  }
  .related-list{display:flex; flex-direction:column;}
  .related-row{
    display:grid; grid-template-columns:52px 1fr auto; align-items:center; gap:16px;
    padding:12px 10px; border-radius:10px; cursor:pointer; transition:background 0.2s;
  }
  .related-row:hover{background:var(--bg-card);}
  .related-art{width:52px; height:52px; border-radius:8px; background:linear-gradient(135deg, var(--wine-bright), #2A0810); flex-shrink:0; overflow:hidden;}
  .related-art img{width:100%; height:100%; object-fit:cover;}
  .related-title{font-size:14.5px; font-weight:600; margin-bottom:2px;}
  .related-artist{font-size:12px; color:var(--text-dim);}
  .related-plays{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim);}

  /* ===== Recent Posts + Follow Us (appended after comments) ===== */
  section.follow-section{margin-top:56px;}
  .recent-posts-list{display:flex; flex-direction:column; margin-bottom:40px;}
  .recent-post-row{
    display:grid; grid-template-columns:52px 1fr; align-items:center; gap:16px;
    padding:12px 10px; border-radius:10px; cursor:pointer; transition:background 0.2s;
  }
  .recent-post-row:hover{background:var(--bg-card);}
  .recent-post-art{width:52px; height:52px; border-radius:8px; background:linear-gradient(135deg, var(--wine-bright), #2A0810); flex-shrink:0; overflow:hidden;}
  .recent-post-art img{width:100%; height:100%; object-fit:cover;}
  .recent-post-title{font-size:14.5px; font-weight:600; margin-bottom:2px;}
  .recent-post-date{font-size:12px; color:var(--text-dim);}

  .follow-us{text-align:center; padding-top:8px;}
  .follow-us .section-label{text-align:center;}
  .follow-icons{display:flex; justify-content:center; gap:14px;}
  .follow-icon{
    width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--text);
    transition:all 0.2s;
  }
  .follow-icon:hover{border-color:var(--gold); color:var(--gold); background:rgba(217,164,65,0.08);}
  .follow-icon[aria-label="Facebook"]{color:#1877F2;}
  .follow-icon[aria-label="Instagram"]{color:#E1306C;}
  .follow-icon[aria-label="TikTok"]{color:#FFFFFF;}
  .follow-icon[aria-label="Facebook"]:hover{color:#1877F2; border-color:#1877F2; background:rgba(24,119,242,0.12);}
  .follow-icon[aria-label="Instagram"]:hover{color:#E1306C; border-color:#E1306C; background:rgba(225,48,108,0.12);}
  .follow-icon[aria-label="TikTok"]:hover{color:#FFFFFF; border-color:#FFFFFF; background:rgba(255,255,255,0.1);}

  /* ===== Comments ===== */
  section.comments{margin-top:56px;}
  .comments-count{color:var(--text-dim); font-weight:500;}
  .comment-form{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:28px;
  }
  .comment-form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .comment-form input, .comment-form textarea{
    width:100%; background:var(--bg-raised); border:1px solid var(--line); border-radius:10px;
    padding:11px 14px; font-size:13.5px; color:var(--text); outline:none;
    font-family:'Inter',sans-serif; transition:border-color 0.2s;
  }
  .comment-form input:focus, .comment-form textarea:focus{border-color:var(--gold);}
  .comment-form textarea{resize:none; margin-bottom:12px;}
  .comment-form-foot{display:flex; justify-content:space-between; align-items:center;}
  .comment-form-hint{font-size:11.5px; color:var(--text-dim);}
  .comment-submit{
    background:var(--gold); color:#0B0B0D; font-weight:700; font-size:13.5px;
    padding:10px 22px; border-radius:100px; border:none;
  }
  .comment-submit:hover{background:#E5B45C;}
  .comment-submit:disabled{opacity:0.6;}
  .comment-error{color:#E27878; font-size:12.5px; margin-top:8px;}
  .comment-success{color:var(--green); font-size:12.5px; margin-top:8px;}

  .comment-item{
    display:flex; gap:12px;
    padding:18px 0;
    border-bottom:1px solid var(--line);
  }
  .comment-item:last-child{border-bottom:none;}
  .comment-avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--gold), #B87A2E);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:#0B0B0D;
  }
  .comment-name{font-size:13.5px; font-weight:700;}
  .comment-time{font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-left:8px; font-weight:400;}
  .comment-text{font-size:13.5px; color:#D8D5CE; line-height:1.6; margin-top:4px;}

  .state-block{
    padding:40px 20px; text-align:center; color:var(--text-dim); font-size:14px;

    <div id="songContent">
      <div class="state-block">Loading song…</div>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://kqgnpryubgdtmtcjtasi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxZ25wcnl1YmdkdG10Y2p0YXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTQ1NjQsImV4cCI6MjA5OTczMDU2NH0.T0y1CVCzIvfmK4vgczmlpiAFZP63MRLZT5eymu8R6jY";

  async function supabaseQuery(table, params) {
    const url = `${SUPABASE_URL}/rest/v1/${table}?${params}`;
    const res = await fetch(url, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    if (!res.ok) throw new Error(`Failed to load ${table}`);
    return res.json();
  }

  async function supabaseInsert(table, body) {
    const url = `${SUPABASE_URL}/rest/v1/${table}`;
    const res = await fetch(url, {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=representation",
      },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("Insert failed");
    return res.json();
  }

  async function supabaseRpc(fn, args) {
    const url = `${SUPABASE_URL}/rest/v1/rpc/${fn}`;
    const res = await fetch(url, {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(args),
    });
    return res.ok;
  }

  function formatCount(n) {
    if (n == null) return "0";
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }

  function timeAgo(dateString) {
    if (!dateString) return "";
    const diff = Date.now() - new Date(dateString).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return `${days}d ago`;
  }

  function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function initials(name) {
    if (!name) return "?";
    return name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join("");
  }

  const ICON_DOWNLOAD = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
  const ICON_STREAM = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  const ICON_PAUSE = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>`;
  const ICON_HEART = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>`;
  const ICON_SHARE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`;

  const params = new URLSearchParams(window.location.search);
  if (window.__PRETTY) params.set(window.__PRETTY.k, window.__PRETTY.v);
  const songSlug = params.get("slug");
  const songId = params.get("id");
  let currentSong = null;
  let liked = false;

  async function loadSong() {
    if (!songSlug && !songId) {
      document.getElementById("songContent").innerHTML = `<div class="state-block">No song specified.</div>`;
      return;
    }
    try {
      // Prefer the clean slug when present; fall back to id for older links
      // that were shared before slugs existed, so nothing breaks.
      const filter = songSlug ? `slug=eq.${encodeURIComponent(songSlug)}` : `id=eq.${songId}`;
      const rows = await supabaseQuery("content", `${filter}&status=eq.Published&select=*`);
      if (!rows || rows.length === 0) {
        document.getElementById("songContent").innerHTML = `<div class="state-block">This song couldn't be found — it may have been removed.</div>`;
        return;
      }
      currentSong = rows[0];
      document.getElementById("crumbTitle").textContent = currentSong.title;
      document.title = `${currentSong.title} — MyGospelHub`;
      setSeo(document.title, currentSong.description || `Play and download "${currentSong.title}" by ${currentSong.artist} on MyGospelHub.`, "song.html", currentSong.slug || currentSong.id);
      renderSong();
      loadRelated();
      loadComments();
      loadFollowSection();
    } catch (err) {
      console.error(err);
      document.getElementById("songContent").innerHTML = `<div class="state-block">Couldn't load this song right now. Refresh to try again.</div>`;
    }
  }

function setSeo(title, desc, page, id) {
  try {
    var m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute("content", String(desc || title).replace(/\*|\[\[|\]\]/g, "").replace(/\s+/g, " ").slice(0, 155));
    var l = document.querySelector('link[rel="canonical"]');
    if (!l) { l = document.createElement("link"); l.rel = "canonical"; document.head.appendChild(l); }
    l.href = "https://mygospelhub.com.ng/" + String(page).replace("gist-post.html","gist").replace(".html","") + "/" + encodeURIComponent(id);
  } catch (e) {}
}
  // Turns a YouTube or Vimeo link into an embeddable player address (or "" if it can't be embedded).
  function toEmbed(url) {
    try {
      const u = new URL(url);
      const host = u.hostname.replace(/^www\.|^m\./, "");
      let id = "";
      if (host === "youtu.be") id = u.pathname.slice(1).split("/")[0];
      else if (host === "youtube.com" || host === "music.youtube.com") {
        if (u.pathname === "/watch") id = u.searchParams.get("v") || "";
        else {
          const m = u.pathname.match(/^\/(embed|shorts|live)\/([\w-]{6,})/);
          if (m) id = m[2];
        }
      }
      if (id && /^[\w-]{6,}$/.test(id)) return `https://www.youtube-nocookie.com/embed/${id}?rel=0&playsinline=1`;
      if (host === "vimeo.com") {
        const m = u.pathname.match(/^\/(\d+)/);
        if (m) return `https://player.vimeo.com/video/${m[1]}`;
      }
    } catch (e) {}
    return "";
  }
  const postedDate = (iso) => iso ? new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
  function renderSong() {
    const s = currentSong;
    const releaseAt = s.release_date ? new Date(s.release_date).getTime() : 0;
    const locked = releaseAt > Date.now();
    const hasFile = !locked && Boolean(s.file_url);
    const streamUrl = locked ? "" : (s.streaming_link || s.video_url || "");
    const embedSrc = toEmbed(streamUrl);

    document.getElementById("songContent").innerHTML = `
      <div class="np-bar">
        <button class="np-btn" id="npBack" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <span class="np-label">${locked ? "Coming soon" : "Now playing"}</span>
        <button class="np-btn" id="npMore" aria-label="Share"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
      </div>
      <div class="posted-by">Posted By: <strong>${escapeHtml(s.uploaded_by || "MyGospelHub")}</strong>${s.created_at ? `<span class="pb-dot">•</span><span>${postedDate(s.created_at)}</span>` : ""}</div>
      <div class="song-header">
        <div class="song-cover">${s.cover_url ? `<img src="${escapeHtml(s.cover_url)}" alt="">` : ""}</div>
        <div>
          <div class="song-tags">
            ${s.genre ? `<span class="song-tag">${escapeHtml(s.genre)}</span>` : ""}
            ${s.year ? `<span class="song-tag">${escapeHtml(String(s.year))}</span>` : ""}
            <span class="song-tag">${escapeHtml(s.type || "Audio")}</span>
          </div>
          <h1 class="song-title">${escapeHtml(s.title)}</h1>
          <div class="song-artist">${MGH.artistHtml(s.artist)}</div>
          ${s.description ? `<p class="song-desc">${MGH.linkText(s.description, s.artist)}</p>` : ""}
        </div>
      </div>

      ${embedSrc ? `
      <div class="yt-card">
        <iframe id="songFrame" src="${escapeHtml(embedSrc)}" title="${escapeHtml(s.title)}" style="width:100%;height:100%;border:0;display:block;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>
      </div>
      <p class="yt-note">Video not loading? <a href="${escapeHtml(streamUrl)}" target="_blank" rel="noopener">Open it on ${embedSrc.includes("vimeo") ? "Vimeo" : "YouTube"}</a></p>
      ` : ""}

      <div class="stats-row">
        <div class="stat"><div class="stat-value">${formatCount(s.views)}</div><div class="stat-label">Plays</div></div>
        <div class="stat"><div class="stat-value">${formatCount(s.downloads)}</div><div class="stat-label">Downloads</div></div>
        <div class="stat"><div class="stat-value" id="likeCount">${formatCount(s.likes)}</div><div class="stat-label">Likes</div></div>
      </div>

      ${locked ? `
      <div class="release-box" id="releaseBox">
        <div class="rb-pill"><i class="rb-dot"></i>Coming soon</div>
        <div class="release-label">Releases <em>in</em></div>
        <div class="countdown" id="countdown">
          <div class="cd-unit cd-days"><div class="cd-num" id="cdD">0</div><div class="cd-lbl">Days</div></div>
          <span class="cd-sep">:</span>
          <div class="cd-unit"><div class="cd-num" id="cdH">00</div><div class="cd-lbl">Hrs</div></div>
          <span class="cd-sep">:</span>
          <div class="cd-unit"><div class="cd-num" id="cdM">00</div><div class="cd-lbl">Min</div></div>
          <span class="cd-sep">:</span>
          <div class="cd-unit"><div class="cd-num" id="cdS">00</div><div class="cd-lbl">Sec</div></div>
        </div>
        ${s.created_at ? `<div class="rb-progress"><div class="rb-bar" id="cdBar"></div></div><div class="rb-progress-note" id="cdNote"></div>` : ""}
        <div class="release-date-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${escapeHtml(new Date(releaseAt).toLocaleString([], {dateStyle:"full", timeStyle:"short"}))}</div>
      </div>
      ` : ""}

      ${hasFile ? `
      <div class="inline-player" id="inlinePlayer">
        <button class="inline-play-btn" id="inlinePlayBtn">${ICON_STREAM}</button>
        <div class="inline-player-body">
          <div class="inline-progress wave" id="inlineProgress"><div class="inline-progress-fill" id="inlineProgressFill"></div></div>
          <div class="inline-time"><span id="inlineCurrentTime">0:00</span><span id="inlineDuration">0:00</span></div>
        </div>
      </div>
      <audio id="audioEl" src="${escapeHtml(s.file_url)}" preload="none"></audio>
      ` : ""}

      <div class="actions-row">
        ${locked ? `<button class="action-btn action-locked" disabled>${ICON_DOWNLOAD} Download unlocks on release</button>` : ""}
        ${hasFile ? `<button class="action-btn action-download" id="downloadBtn">${ICON_DOWNLOAD} Download</button>` : ""}
        ${streamUrl ? `<button class="action-btn action-stream" id="streamBtn">${ICON_STREAM} Stream</button>` : ""}
        <button class="action-like" id="likeBtn">${ICON_HEART} <span id="likeBtnCount">${formatCount(s.likes)}</span></button>
        <button class="action-share" id="shareBtn">${ICON_SHARE}<span class="al">Share</span></button>
      </div>

      ${s.description ? `<div class="about-card"><h3>About this song</h3><p>${MGH.linkText(s.description, s.artist)}</p></div>` : ""}

      <div class="details-card">
        <div class="details-head">Track Details</div>
        ${[
          ["Artist", s.artist, MGH.artistHtml(s.artist)],
          ["Title", s.title, MGH.nameLink(s.title)],
          ["Producer", s.producer],
          ["Genre", s.genre],
          ["Released", s.year],
          ["Category", s.type || "Audio"],
        ].filter(r => r[1]).map(r => `<div class="detail-row"><div class="detail-label">${r[0]}</div><div class="detail-value">${r[2] || escapeHtml(String(r[1]))}</div></div>`).join("")}
      </div>

      ${s.lyrics ? `
      <div class="lyrics-section">
        <button class="lyrics-toggle" id="lyricsToggle">
          <span>Lyrics</span>
          <svg id="lyricsChevron" style="transform:rotate(180deg)" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="lyrics-body open" id="lyricsBody">${escapeHtml(s.lyrics)}</div>
      </div>
      ` : ""}
    `;

    if (locked) {
      const pad = n => String(n).padStart(2, "0");
      const box = document.getElementById("releaseBox");
      if (s.cover_url && box) box.style.setProperty("--cover", 'url("' + encodeURI(s.cover_url).replace(/"/g, "%22") + '")');
      const createdAt = s.created_at ? new Date(s.created_at).getTime() : 0;
      const setNum = (id, v) => {
        const el = document.getElementById(id);
        if (!el || el.textContent === String(v)) return;
        el.textContent = v;
        el.classList.remove("tick"); void el.offsetWidth; el.classList.add("tick");
      };
      const tick = () => {
        const left = releaseAt - Date.now();
        if (left <= 0) { clearInterval(window.__cd); renderSong(); return; }
        setNum("cdD", Math.floor(left / 86400000));
        setNum("cdH", pad(Math.floor(left / 3600000) % 24));
        setNum("cdM", pad(Math.floor(left / 60000) % 60));
        setNum("cdS", pad(Math.floor(left / 1000) % 60));
        const bar = document.getElementById("cdBar");
        if (bar && createdAt && releaseAt > createdAt) {
          const pct = Math.max(2, Math.min(100, ((Date.now() - createdAt) / (releaseAt - createdAt)) * 100));
          bar.style.width = pct.toFixed(1) + "%";
          const note = document.getElementById("cdNote");
          if (note) note.textContent = Math.round(pct) + "% of the wait is over";
        }
      };
      clearInterval(window.__cd);
      tick();
      window.__cd = setInterval(tick, 1000);
    }

    if (s.lyrics) {
      const lyricsToggle = document.getElementById("lyricsToggle");
      const lyricsBody = document.getElementById("lyricsBody");
      const lyricsChevron = document.getElementById("lyricsChevron");
      lyricsToggle.addEventListener("click", () => {
        const isOpen = lyricsBody.classList.toggle("open");
        lyricsChevron.style.transform = isOpen ? "rotate(180deg)" : "rotate(0deg)";
      });
    }

    document.getElementById("npBack").addEventListener("click", () => { if (history.length > 1) history.back(); else location.href = "music.html"; });
    document.getElementById("npMore").addEventListener("click", () => { const b = document.getElementById("shareBtn"); if (b) b.click(); });
    const waveEl = document.getElementById("inlineProgress"), waveAudio = document.getElementById("audioEl");
    if (waveEl && waveAudio) {
      const setP = () => waveEl.style.setProperty("--p", (waveAudio.duration ? (waveAudio.currentTime / waveAudio.duration) * 100 : 0) + "%");
      ["timeupdate", "seeked", "loadedmetadata", "ended"].forEach(ev => waveAudio.addEventListener(ev, setP));
    }

    // ---------- Real audio playback (only when a real file exists) ----------
    if (hasFile) {
      const audio = document.getElementById("audioEl");
      const playBtn = document.getElementById("inlinePlayBtn");
      const progress = document.getElementById("inlineProgress");
      const progressFill = document.getElementById("inlineProgressFill");
      const currentTimeEl = document.getElementById("inlineCurrentTime");
      const durationEl = document.getElementById("inlineDuration");
      let hasCountedPlay = false;

      function formatTime(sec) {
        if (!isFinite(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s2 = Math.floor(sec % 60).toString().padStart(2, "0");
        return `${m}:${s2}`;
      }

      audio.addEventListener("play", () => MGH.setMediaSession(s, audio));

      function togglePlay() {
        if (audio.paused) {
          audio.play();
        } else {
          audio.pause();
        }
      }

      playBtn.addEventListener("click", togglePlay);
      audio.addEventListener("play", () => {
        playBtn.innerHTML = ICON_PAUSE;
        if (!hasCountedPlay) {
          hasCountedPlay = true;
          supabaseRpc("increment_views", { row_id: s.id });
        }
      });
      audio.addEventListener("pause", () => { playBtn.innerHTML = ICON_STREAM; });
      audio.addEventListener("ended", () => { playBtn.innerHTML = ICON_STREAM; });
      audio.addEventListener("loadedmetadata", () => { durationEl.textContent = formatTime(audio.duration); });
      audio.addEventListener("timeupdate", () => {
        currentTimeEl.textContent = formatTime(audio.currentTime);
        if (audio.duration) progressFill.style.width = `${(audio.currentTime / audio.duration) * 100}%`;
      });
      progress.addEventListener("click", (e) => {
        const rect = progress.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        if (audio.duration) audio.currentTime = ratio * audio.duration;
      });
    }

    const songFrame = document.getElementById("songFrame");
    if (songFrame) {
      let ytCounted = false;
      window.addEventListener("blur", () => {
        setTimeout(() => {
          if (!ytCounted && document.activeElement === songFrame) {
            ytCounted = true;
            supabaseRpc("increment_views", { row_id: s.id });
          }
        }, 0);
      });
    }

    const streamBtnEl = document.getElementById("streamBtn");
    if (streamBtnEl) {
      streamBtnEl.addEventListener("click", () => {
        supabaseRpc("increment_views", { row_id: s.id });
        window.open(streamUrl, "_blank", "noopener,noreferrer");
      });
    }

    const downloadBtn = document.getElementById("downloadBtn");
    if (downloadBtn) {
      downloadBtn.addEventListener("click", async () => {
        supabaseRpc("increment_downloads", { row_id: s.id });
        // Force an actual file download instead of opening it in a new tab
        await MGH.downloadSong(s);
      });
    }

    document.getElementById("likeBtn").addEventListener("click", async (e) => {
      if (liked) return; // one like per page visit, keeps it simple and honest
      liked = true;
      const btn = e.currentTarget;
      btn.classList.add("liked");
      const newCount = (s.likes || 0) + 1;
      document.getElementById("likeCount").textContent = formatCount(newCount);
      document.getElementById("likeBtnCount").textContent = formatCount(newCount);
      s.likes = newCount;
      await supabaseRpc("increment_likes", { row_id: s.id });
    });

    document.getElementById("shareBtn").addEventListener("click", async () => {
      const shareUrl = s.slug ? `${window.location.origin}/song/${encodeURIComponent(s.slug)}` : `${window.location.origin}/song/${s.id}`;
      const shareData = { title: s.title, text: `${s.title} — ${s.artist} on MyGospelHub`, url: shareUrl };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) {}
      } else {
        await navigator.clipboard.writeText(shareUrl);
        const btn = document.getElementById("shareBtn");
        const original = btn.innerHTML;
        btn.innerHTML = "Link copied!";
        setTimeout(() => { btn.innerHTML = original; }, 1800);
      }
    });
  }

  // Card used for "More like this" and "Recent Posts": same design as the Music page.
  function itemCardHtml(r, metaText) {
    const page = r.type === "Video" ? "/video/" : "/song/";
    const locked = r.release_date && new Date(r.release_date).getTime() > Date.now();
    const canDl = Boolean(r.file_url) && !locked;
    return `
      <div class="track-card" data-href="${page}${encodeURIComponent(r.slug || r.id)}" data-id="${escapeHtml(String(r.id))}">
        <div class="tc-art" style="${r.cover_url ? `background-image:url('${escapeHtml(r.cover_url)}')` : ""}"></div>
        <div class="tc-body">
          <div class="tc-title">${escapeHtml(r.title)}</div>
          <div class="tc-artist">${escapeHtml(r.artist || "")}</div>
          <div class="tc-meta">${escapeHtml(metaText)}</div>
          ${locked ? `<div class="tc-lock">Releases ${escapeHtml(new Date(r.release_date).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }))}</div>` : ""}
        </div>
        <div class="tc-actions">
          <button class="tc-btn play" data-act="open" aria-label="Open ${escapeHtml(r.title)}">${ICON_STREAM}</button>
          <button class="tc-btn dl" data-act="download" aria-label="Download ${escapeHtml(r.title)}" ${canDl ? "" : "disabled"}>${ICON_DOWNLOAD}</button>
        </div>
      </div>`;
  }

  function wireItemCards(container, rows) {
    container.addEventListener("click", async (e) => {
      const card = e.target.closest(".track-card");
      if (!card) return;
      const btn = e.target.closest(".tc-btn");
      if (btn && btn.dataset.act === "download") {
        e.stopPropagation();
        const item = rows.find(x => String(x.id) === card.dataset.id);
        if (!item || !item.file_url) return;
        supabaseRpc("increment_downloads", { row_id: item.id });
        await MGH.downloadSong(item);
        return;
      }
      window.location.href = card.dataset.href;
    });
  }

  async function loadRelated() {
    try {
      const rows = await supabaseQuery(
        "content",
        `status=eq.Published&id=neq.${currentSong.id}&type=eq.${encodeURIComponent(currentSong.type || "Audio")}&genre=eq.${encodeURIComponent(currentSong.genre || "")}&order=views.desc&limit=4`
      );
      const wrap = document.createElement("section");
      wrap.className = "related";
      if (!rows || rows.length === 0) {
        wrap.innerHTML = `<div class="section-label"><small>Keep listening</small>More like this</div><div class="state-block">No related tracks yet.</div>`;
      } else {
        wrap.innerHTML = `
          <div class="section-label"><small>Keep listening</small>More like this</div>
          <div class="tc-list" id="relatedList">
            ${rows.map(r => itemCardHtml(r, [r.year, `${formatCount(r.views)} plays`].filter(Boolean).join(" • "))).join("")}
          </div>
        `;
        wireItemCards(wrap.querySelector("#relatedList"), rows);
      }
      document.getElementById("songContent").appendChild(wrap);
    } catch (err) {
      console.error(err);
    }
  }

  async function loadFollowSection() {
    const wrap = document.createElement("section");
    wrap.className = "follow-section";
    wrap.innerHTML = `
      <div class="section-label">Recent Posts</div>
      <div id="recentPostsList"><div class="state-block">Loading…</div></div>

      <div class="follow-us">
        <div class="section-label">Follow Us On</div>
        <div class="follow-icons">
          <a href="https://www.facebook.com/share/1DyGHVpWsx/" target="_blank" rel="noopener noreferrer" class="follow-icon" aria-label="Facebook">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg>
          </a>
          <a href="https://www.instagram.com/iam_davidfrank?igsh=cGlra3Rpb3FubW94" target="_blank" rel="noopener noreferrer" class="follow-icon" aria-label="Instagram">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </a>
          <a href="https://vm.tiktok.com/ZS9hfCLFCGack-otoG1/" target="_blank" rel="noopener noreferrer" class="follow-icon" aria-label="TikTok">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2h-3v13.5a2.5 2.5 0 11-2.5-2.5c.17 0 .34.02.5.05V10a5.5 5.5 0 105.5 5.5V9.2a6.5 6.5 0 003.5 1.02V7.2A4.5 4.5 0 0116.5 2z"/></svg>
          </a>
        </div>
      </div>
    `;
    document.getElementById("songContent").appendChild(wrap);

    try {
      const rows = await supabaseQuery(
        "content",
        `status=eq.Published&id=neq.${currentSong.id}&order=created_at.desc&limit=4&select=*`
      );
      const list = document.getElementById("recentPostsList");
      if (!rows || rows.length === 0) {
        list.innerHTML = `<div class="state-block">Nothing else posted yet.</div>`;
        return;
      }
      list.innerHTML = `
        <div class="tc-list" id="recentList">
          ${rows.map(r => itemCardHtml(r, `${r.type === "Video" ? "Video" : "Song"} • ${timeAgo(r.created_at)}`)).join("")}
        </div>
      `;
      wireItemCards(list.querySelector("#recentList"), rows);
    } catch (err) {
      console.error(err);
      document.getElementById("recentPostsList").innerHTML = `<div class="state-block">Couldn't load recent posts.</div>`;
    }
  }


  async function loadComments() {
    const wrap = document.createElement("section");
    wrap.className = "comments";
    wrap.innerHTML = `
      <div class="section-label">Comments <span class="comments-count" id="commentsCount"></span></div>
      <div class="comment-form">
        <div class="comment-form-row">
          <input type="text" id="commentName" placeholder="Your name" maxlength="60">
          <input type="email" id="commentEmail" placeholder="Email (optional)" maxlength="120">
        </div>
        <textarea id="commentText" rows="3" placeholder="Share your thoughts…" maxlength="600"></textarea>
        <div class="comment-form-foot">
          <span class="comment-form-hint">Your email is never shown publicly.</span>
          <button class="comment-submit" id="commentSubmit">Post comment</button>
        </div>
        <div id="commentMsg"></div>
      </div>
      <div id="commentsList"><div class="state-block">Loading comments…</div></div>
    `;
    document.getElementById("songContent").appendChild(wrap);

    document.getElementById("commentSubmit").addEventListener("click", submitComment);
    refreshComments();
  }

  async function refreshComments() {
    try {
      const rows = await supabaseQuery("comments", `content_id=eq.${currentSong.id}&status=eq.Visible&order=created_at.desc`);
      document.getElementById("commentsCount").textContent = `(${rows.length})`;
      const list = document.getElementById("commentsList");
      if (!rows || rows.length === 0) {
        list.innerHTML = `<div class="state-block">Be the first to comment on this one.</div>`;
        return;
      }
      list.innerHTML = rows.map(c => `
        <div class="comment-item">
          <div class="comment-avatar">${escapeHtml(initials(c.guest_name || "?"))}</div>
          <div>
            <span class="comment-name">${escapeHtml(c.guest_name || "Anonymous")}</span>
            <span class="comment-time">${timeAgo(c.created_at)}</span>
            <div class="comment-text">${escapeHtml(c.text)}</div>
          </div>
        </div>
      `).join("");
    } catch (err) {
      console.error(err);
      document.getElementById("commentsList").innerHTML = `<div class="state-block">Couldn't load comments right now.</div>`;
    }
  }

  async function submitComment() {
    const nameEl = document.getElementById("commentName");
    const emailEl = document.getElementById("commentEmail");
    const textEl = document.getElementById("commentText");
    const msgEl = document.getElementById("commentMsg");
    const btn = document.getElementById("commentSubmit");

    const name = nameEl.value.trim();
    const email = emailEl.value.trim();
    const text = textEl.value.trim();

    msgEl.innerHTML = "";
    if (!name) { msgEl.innerHTML = `<div class="comment-error">Please add your name.</div>`; return; }
    if (!text) { msgEl.innerHTML = `<div class="comment-error">Write a comment before posting.</div>`; return; }

    btn.disabled = true;
    btn.textContent = "Posting…";

    try {
      await supabaseInsert("comments", {
        content_id: currentSong.id,
        guest_name: name,
        guest_email: email || null,
        text: text,
        status: "Visible",
      });
      nameEl.value = ""; emailEl.value = ""; textEl.value = "";
      msgEl.innerHTML = `<div class="comment-success">Comment posted!</div>`;
      refreshComments();
    } catch (err) {
      console.error(err);
      msgEl.innerHTML = `<div class="comment-error">Couldn't post your comment — try again in a moment.</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "Post comment";
    }
  }

  loadSong();
</script>
